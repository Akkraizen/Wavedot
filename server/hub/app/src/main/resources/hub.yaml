server:
  host: ${HUB_HOST:-0.0.0.0}
  port: ${HUB_PORT:-8081}
  trustForwardedHeaders: ${HUB_TRUST_FORWARDED_HEADERS:-false}
database:
  url: ${HUB_DATABASE_URL:-jdbc:postgresql://localhost:5432/wavedot_hub}
  user: ${HUB_DATABASE_USER:-wavedot}
  password: ${HUB_DATABASE_PASSWORD:-wavedot}
  maxPoolSize: ${HUB_DATABASE_POOL:-10}
registration:
  mode: ${HUB_REGISTRATION_MODE:-TOKEN}
  token: ${HUB_REGISTRATION_TOKEN:-}
limits:
  maxBatch: ${HUB_MAX_BATCH:-500}
  maxPayloadBytes: ${HUB_MAX_PAYLOAD_BYTES:-16384}
  maxItemsPerAccount: ${HUB_MAX_ITEMS_PER_ACCOUNT:-50000}
  maxClockSkew: ${HUB_MAX_CLOCK_SKEW:-24h}
